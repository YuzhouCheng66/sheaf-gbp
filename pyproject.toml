[project]
name = "sheaf-gbp"
version = "0.2.0"
description = "Route-free local planning and communication-efficient Sheaf-GBP control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
piano-movers-demo = "piano_movers.single_slit_interactive_demo:main"
piano-movers-waypoints = "piano_movers.multi_waypoint_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piano_movers"]

[tool.ruff]
line-length = 100
target-version = "py310"
